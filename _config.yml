# 사이트 기본 정보 (여기만 고치면 전체에 반영됩니다)
title: 고려대학교 분자의학연구소
title_en: Institute for Molecular Medicine
title_en_full: Institute for Molecular Medicine at Korea University
university: Korea University
description: 고려대학교 분자의학연구소 (Institute for Molecular Medicine) 홈페이지

address: 서울특별시 성북구 고려대로 73 고려대학교 문숙의학관 3층
zipcode: "02841"
phone: 02-2286-1181
email: yyb77@korea.ac.kr

# 검색엔진 노출 차단 여부 (true 이면 차단)
noindex: false

# 정식 도메인
url: "https://imm.korea.ac.kr"
baseurl: ""

lang: ko
timezone: Asia/Seoul
markdown: kramdown

collections:
  notices:
    output: true
    permalink: /board/notice/:year:month:day-:title/
  seminars:
    output: true
    permalink: /board/seminar/:year:month:day-:title/

defaults:
  - scope: { path: "", type: notices }
    values: { layout: post, section: board, board: notice, board_name: 공지사항 }
  - scope: { path: "", type: seminars }
    values: { layout: post, section: board, board: seminar, board_name: 연구소 일정 }

exclude:
  - README.md
  - preview_build.py
  - .pages.yml
