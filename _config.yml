# 시안 단계: 검색엔진 노출 차단. 정식 공개할 때 false 로 바꾸세요
noindex: true

# 도메인 연결 전에는 비워 둡니다
url: ""
baseurl: ""

lang: ko
timezone: Asia/Seoul
markdown: kramdown

collections:
  notices:
    output: true
    permalink: /board/notice/:year:month:day-:title/
  seminars:
    output: true
    permalink: /board/seminar/:year:month:day-:title/

defaults:
  - scope: { path: "", type: notices }
    values: { layout: post, section: board, board: notice, board_name: 공지사항 }
  - scope: { path: "", type: seminars }
    values: { layout: post, section: board, board: seminar, board_name: 연구소 일정 }

exclude:
  - README.md
  - preview_build.py
  - .pages.yml
