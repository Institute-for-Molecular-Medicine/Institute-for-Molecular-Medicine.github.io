---
layout: sub
---
{% assign d = site.data.greeting %}
<div class="greeting">
  <div class="greet-photo">{% if d.photo %}<img src="{{ d.photo | relative_url }}" alt="연구소장 사진">{% endif %}</div>
  <div class="greet-text">
    {% if d.heading %}<p class="greet-title">{{ d.heading }}</p>{% endif %}
    {{ d.message }}
    <p class="sign">{{ d.sign_title }} <strong>{{ d.name }}</strong></p>
  </div>
</div>
