# Pages CMS (https://pagescms.org) 관리자 화면 설정
media:
  input: assets/uploads
  output: /assets/uploads

content:
  - name: seminars
    label: 연구소 일정 (세미나)
    type: collection
    path: _seminars
    filename: "{year}-{month}-{day}-seminar-{hour}{minute}{second}.md"
    view:
      fields: [title, event_date]
      primary: title
    fields:
      - { name: title, label: "제목", type: string, required: true, description: "예: 연구소 초청 세미나 (2026년 11월 3일) 홍길동 교수" }
      - { name: poster, label: "포스터 이미지", type: image, description: "포스터 그림 파일을 여기에 끌어다 놓으세요. 글 맨 위에 크게 표시됩니다." }
      - { name: event_date, label: "세미나 날짜", type: date, required: true }
      - { name: time, label: "시간", type: string, description: "예: 오후 5시" }
      - { name: speaker, label: "연사", type: string, description: "예: 홍길동 교수" }
      - { name: affiliation, label: "연사 소속", type: string }
      - { name: venue, label: "장소", type: string, description: "예: 의학도서관 1층 교육실" }
      - { name: date, label: "게시일", type: date, required: true, description: "오늘 날짜를 고르세요." }
      - { name: attachment, label: "첨부파일 (선택)", type: file }
      - { name: body, label: "본문 (선택)", type: rich-text }

  - name: notices
    label: 공지사항
    type: collection
    path: _notices
    filename: "{year}-{month}-{day}-notice-{hour}{minute}{second}.md"
    view:
      fields: [title, date]
      primary: title
    fields:
      - { name: title, label: "제목", type: string, required: true }
      - { name: date, label: "게시일", type: date, required: true, description: "오늘 날짜를 고르세요." }
      - { name: poster, label: "이미지 (선택)", type: image, description: "포스터나 안내 그림이 있으면 넣으세요. 글 맨 위에 크게 표시됩니다." }
      - { name: body, label: "본문", type: rich-text }
      - { name: attachment, label: "첨부파일 (선택)", type: file }

  # 연구소 소개 페이지들 (글자만 바꾸면 화면 모양은 그대로 유지됩니다)
  - name: page-intro
    label: "소개: 연구소 개요"
    type: file
    path: _data/intro.yml
    format: yaml
    fields:
      - { name: lead, label: "소개 문장", type: text }
      - { name: purpose, label: "설립목적", type: text }
      - name: rules
        label: "연구소 내규"
        type: object
        list: true
        fields:
          - { name: item, label: "구분", type: string }
          - { name: content, label: "주요 내용", type: text }
      - { name: rules_note, label: "내규 아래 안내 문구", type: string }

  - name: page-greeting
    label: "소개: 소장 인사말"
    type: file
    path: _data/greeting.yml
    format: yaml
    fields:
      - { name: photo, label: "소장 사진", type: image, description: "세로 사진을 권장합니다." }
      - { name: heading, label: "첫 문장 (크게 표시)", type: string }
      - { name: message, label: "인사말 본문", type: rich-text }
      - { name: sign_title, label: "서명 직함", type: string }
      - { name: name, label: "소장 이름", type: string }

  - name: page-research
    label: "소개: 연구분야 (연구부)"
    type: file
    path: _data/research.yml
    format: yaml
    fields:
      - name: fields
        label: "연구부"
        type: object
        list: true
        fields:
          - { name: title, label: "연구부 이름", type: string, description: "여기 이름이 연구소 개요의 조직도에도 그대로 표시됩니다." }
          - { name: en, label: "영문명", type: string }
          - { name: desc, label: "설명", type: text }

  - name: page-history
    label: "소개: 연혁"
    type: file
    path: _data/history.yml
    format: yaml
    fields:
      - name: events
        label: "연혁 (최근 것이 위로)"
        type: object
        list: true
        fields:
          - { name: year, label: "연도", type: string }
          - { name: text, label: "내용", type: text, description: "예: 10. 24. 한국분자의학영양연구소로 개칭" }
      - name: directors
        label: "역대 연구소장"
        type: object
        list: true
        fields:
          - { name: period, label: "기간", type: string, description: "예: 2011 ~ 2013" }
          - { name: name, label: "이름", type: string }

  - name: page-members
    label: "소개: 연구인력"
    type: file
    path: _data/members.yml
    format: yaml
    fields:
      - name: groups
        label: "교수진 (구분별)"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - { name: title, label: "구분 이름", type: string, description: "예: 고문, 참여교수, 겸임교수" }
          - name: people
            label: "교수"
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{name}"
            fields:
              - { name: name, label: "이름", type: string }
              - { name: degree, label: "학위", type: string, description: "예: 이학박사, M.D., Ph.D." }
              - { name: affiliation, label: "소속 또는 직위", type: string }
              - { name: url, label: "홈페이지 주소 (선택)", type: string, description: "https:// 로 시작하는 주소. 넣으면 이름을 눌러 이동할 수 있습니다." }
              - { name: photo, label: "사진 (선택)", type: image }
      - name: staff
        label: "연구교수, 연구원, 직원"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - { name: label, label: "구분", type: string, description: "예: 연구교수" }
          - { name: count, label: "인원 수 (선택)", type: string, description: "비워 두면 아래 명단의 사람 수가 자동으로 표시됩니다." }
          - name: people
            label: "명단"
            type: object
            list: true
            fields:
              - { name: name, label: "이름", type: string }
              - { name: note, label: "비고 (선택)", type: string, description: "예: 박석인 교수 연구실" }

  - name: page-industry
    label: "연구업적: 산학 협력"
    type: file
    path: _data/industry.yml
    format: yaml
    fields:
      - { name: intro, label: "소개 문장", type: text }
      - name: companies
        label: "기업"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - { name: name, label: "기업명", type: string }
          - { name: en, label: "영문명", type: string, description: "첫 글자가 원 안의 표시로 쓰입니다." }
          - { name: url, label: "홈페이지 주소", type: string }
          - { name: logo, label: "로고 (정사각형 권장)", type: image, description: "넣으면 원 안에 글자 대신 로고가 표시됩니다." }
          - { name: tagline, label: "한 줄 소개", type: string }
          - { name: desc, label: "회사 소개", type: text }
          - { name: keywords, label: "핵심 키워드", type: string, list: true }
          - { name: person, label: "연구소 참여 교수", type: string, description: "예: 남기훈 교수" }
          - { name: role, label: "역할", type: string, description: "예: 공동창업자 겸 CTO" }
          - { name: color, label: "대표 색상", type: string, description: "예: #009eb1" }
