lead: 고려대학교 분자의학연구소는 질병의 분자적 기전을 규명하고, 이를 바탕으로 새로운 진단 및 치료 전략을 개발하는 기초·중개 연구 기관입니다.
rules:
  - item: 목적
    content: 분자의학 분야의 연구 수행 및 연구 역량 증진
  - item: 조직
    content: 연구소장, 고문, 참여교수 및 6개 연구부로 구성
  - item: 연구소장
    content: 연구소 업무를 총괄하며, 2년 임기로 연임이 가능함
  - item: 운영위원회
    content: 연구소 운영에 관한 주요 사항을 심의
  - item: 연구원
    content: 전임 및 겸임 연구원, 연구교수, 연구원 및 연구조원으로 구성
rules_note: 내규 전문은 연구소 행정실로 문의하시기 바랍니다.
