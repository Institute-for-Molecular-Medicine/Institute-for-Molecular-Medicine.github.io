lead: 고려대학교 분자의학연구소는 질병의 분자적 기전을 규명하고, 이를 바탕으로 새로운 진단 및 치료 전략을 개발하는 기초·중개 연구 기관입니다.
purposes:
- 질병을 유발하는 분자 표적을 발굴하고 그 작용 기전을 규명합니다.
- 면역, 대사, 종양 미세환경 등 다학제 연구를 통해 미충족 의료 수요 질환의 발병 기전을 연구합니다.
- 기초 연구 성과를 진단법과 치료제 개발로 연결하는 중개 연구를 수행합니다.
- 국내외 연구기관과 교류하고 차세대 연구 인력을 양성합니다.
rules:
- item: 목적
  content: 분자의학 분야의 연구 수행 및 연구 역량 증진
- item: 조직
  content: 연구소장, 운영위원회, 연구부, 행정실로 구성
- item: 연구소장
  content: 연구소 업무를 총괄하며 임기는 2년으로 함
- item: 운영위원회
  content: 연구소 운영에 관한 주요 사항을 심의
- item: 연구원
  content: 전임 및 겸임 연구원, 연구교수, 연구원으로 구성
rules_note: 내규 전문은 연구소 행정실로 문의하시기 바랍니다.
