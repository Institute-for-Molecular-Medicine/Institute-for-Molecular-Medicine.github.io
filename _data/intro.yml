lead: 고려대학교 분자의학연구소는 질병의 분자적 기전을 규명하고, 이를 바탕으로 새로운 진단 및 치료 전략을 개발하는 기초·중개 연구 기관입니다.
purpose: 본 연구소는 분자의학 중심의 선도적 기초 및 중개, 융합 연구를 수행하여 혁신적인 의학 지식을 창출하고, 차세대 의료기술 개발을 견인함으로써 인류의 건강한 미래와 삶의 질 향상에 이바지함을 목적으로 한다.
departments:
- name: 분자의학 연구부
  desc: 질병의 분자 수준 발병 기전 규명, 맞춤형 정밀 의학 및 분자 진단 기술 연구 개발에 관한 사항을 분장한다.
- name: 종양 생물학 연구부
  desc: 종양의 발생·진행·전이 기전, 종양 미세환경 규명 및 신규 암 진단 및 치료 전략 연구 개발에 관한 사항을 분장한다.
- name: 면역학 연구부
  desc: 암을 포함한 각종 면역 질환의 원인 및 면역 조절 치료 기술 연구 개발에 관한 사항을 분장한다.
- name: 분자 생물학 연구부
  desc: 유전체, 전사체 등 생체 고분자의 구조와 기능, 유전자 발현 조절 메커니즘 연구 개발에 관한 사항을 분장한다.
- name: 신약 개발 연구부
  desc: 분자 타깃 기반 신약 후보 물질 발굴, 효능 검증, 제형 개발 및 중개 연구 전반에 관한 사항을 분장한다.
- name: 대사 생화학 연구부
  desc: 생체 분자의 대사 과정 및 대사 관련 질환의 기전 규명과 이에 대한 신규 진단 및 치료에 관한 사항을 분장한다.
rules:
- item: 목적
  content: 분자의학 분야의 연구 수행 및 연구 역량 증진
- item: 조직
  content: 연구소장, 고문, 참여교수 및 6개 연구부로 구성
- item: 연구소장
  content: 연구소 업무를 총괄하며 임기는 2년으로 함
- item: 운영위원회
  content: 연구소 운영에 관한 주요 사항을 심의
- item: 연구원
  content: 전임 및 겸임 연구원, 연구교수, 연구원으로 구성
rules_note: 내규 전문은 연구소 행정실로 문의하시기 바랍니다.
