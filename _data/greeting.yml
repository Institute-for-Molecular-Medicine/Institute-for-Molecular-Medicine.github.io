heading: 고려대학교 분자의학연구소 홈페이지를 찾아주신 여러분을 환영합니다.
message: <p>고려대학교 분자의학연구소는 1980년 한국영양문제연구소로 출범하여, 2000년 한국분자의학영양연구소로 이름을 바꾸며 영양학 연구에서 분자의학 연구로 그 영역을 넓혀 왔습니다. 그리고 이제 분자의학연구소(Institute for Molecular Medicine)로 새롭게 출발합니다.</p><p>우리 연구소는 생화학과 분자생물학을 기반으로 암, 만성질환, 희귀질환을 일으키는 분자 표적을 찾고 그 기전을 밝히는 연구에 집중하고 있습니다. 나아가 면역학과 종양 미세환경 연구, 그리고 기초 연구 성과를 진단과 치료로 연결하는 중개 연구를 통해 실제 환자에게 도움이 되는 결과를 만들어 가고자 합니다.</p><p>새로운 이름에 걸맞게 국내외 연구자들과 활발히 교류하며 창의적인 연구를 이어가겠습니다. 여러분의 많은 관심과 성원을 부탁드립니다.</p>
sign_title: 고려대학교 분자의학연구소장
name: 박석인
