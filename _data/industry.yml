intro: 연구소 교수진의 연구를 바탕으로 설립된 기업들과 함께 기초 연구의 성과를 실제 진단과 치료 기술로 연결하고 있습니다.
companies:
- name: 시프트바이오
  en: SHIFTBIO
  url: https://shiftbio.net
  color: '#009eb1'
  tagline: "세포 유래 나노입자 기반 표적 약물전달 플랫폼"
  desc: "시프트바이오는 세포 유래 나노입자(Natural Nanoparticles, NNP)를 활용한 약물전달 플랫폼을 개발합니다. 독자적인 NSM 기술과 약물 탑재 기술을 바탕으로 단백질·핵산·저분자화합물 등 다양한 치료 물질을 나노입자 표면이나 내부에 탑재하고, 표적 조직과 세포로 전달하도록 설계합니다. 이를 기반으로 염증성 질환과 뇌질환 등에 적용할 치료제를 개발하고 있습니다."
  keywords:
  - Natural Nanoparticles (NNP)
  - Targeted Drug Delivery
  - NSM Platform
  person: 남기훈 교수
  role: 공동창업자 겸 대표이사(CEO)
  logo: /assets/img/companies/shiftbio.png
- name: 에이뮨링크
  en: AImmuneLink
  url: https://www.aimmunelink.com
  color: '#f7941e'
  tagline: 질량세포분석 기반 정밀면역 분석
  desc: 질량세포분석(mass cytometry) 플랫폼으로 단일세포 수준의 정밀 면역 분석과 맞춤형 면역 건강관리 서비스를 제공합니다. 면역 빅데이터와 AI로 구축한 면역 디지털 트윈(Immune Digital Twin) 기술을 바탕으로 감염, 백신, 자가면역질환 관련 면역 검사와 면역 노화 측정 서비스를 개발하고 있습니다.
