# 메인 화면 첫 번째 배경 사진(문숙의학관)을 준비하는 1회용 작업입니다.
name: Prepare hero photo

on: workflow_dispatch

permissions:
  contents: write
  actions: write

jobs:
  hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and resize photo
        run: |
          pip install pillow
          curl -fsSL --retry 3 https://cdn.imweb.me/thumbnail/20231205/4f31007ec10a6.jpg -o /tmp/src.jpg
          python3 -c "
          from PIL import Image, ImageEnhance
          im = Image.open('/tmp/src.jpg').convert('RGB')
          im.thumbnail((1600, 1600))
          im = ImageEnhance.Brightness(im).enhance(0.8)
          im.save('assets/img/hero1.jpg', 'JPEG', quality=72, optimize=True, progressive=True)
          "
          ls -la assets/img/hero1.jpg
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/hero1.jpg
          git diff --cached --quiet || (git commit -m "메인 배경 사진 추가" && git push)
      - name: Rebuild site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
